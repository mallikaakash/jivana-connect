[project]
name = "jivana-backend"
version = "0.1.0"
description = "Jivana Connect demo backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "google-auth>=2.40.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.uv]
# A conda-based interpreter leaks its site-packages into uvicorn's --reload worker
# (an unrelated `app` package shadowed ours), so always use a uv-managed Python.
python-preference = "only-managed"
